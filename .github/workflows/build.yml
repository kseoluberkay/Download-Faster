name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      # Only used to attach the exe files to a GitHub release when a v* tag is pushed.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/DownloadFaster.Core.Tests -c Release

      - name: Publish DownloadFaster.exe (x64 and ARM64)
        run: |
          dotnet publish src/DownloadFaster.App -c Release -r win-x64 -o out/x64
          dotnet publish src/DownloadFaster.App -c Release -r win-arm64 -o out/arm64
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out/x64/DownloadFaster.exe dist/DownloadFaster-x64.exe
          Copy-Item out/arm64/DownloadFaster.exe dist/DownloadFaster-arm64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: DownloadFaster-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
